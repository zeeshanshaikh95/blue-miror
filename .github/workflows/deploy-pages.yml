name: Deploy public site to GitHub Pages

# GitHub Pages hosts the static frontend only. The Express API and MongoDB run
# elsewhere; set the repository variable VITE_API_BASE_URL to the deployed API
# URL (including /api) and re-run this workflow when it exists.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_BASE_URL          e.g. https://api.example.com/api
#   VITE_CLOUDINARY_CLOUD_NAME optional, for responsive image delivery
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The dependency tree requires npm 11; npm 10 resolves it incorrectly.
        run: npx --yes npm@11.21.2 ci

      - name: Typecheck and build client
        run: npx --yes npm@11.21.2 run build --workspace client
        env:
          # Custom domain serves the site from the root, so assets must be rooted at "/".
          VITE_BASE: '/'
          VITE_SITE_URL: 'https://www.bluemiror.site'
          VITE_ALLOW_INDEXING: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:4000/api' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

